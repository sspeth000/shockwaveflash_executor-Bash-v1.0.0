name: Build browser SWF toolkit

on:
  push:
    branches: [main]
    paths:
      - "public/vendor/swf-toolkit/src/**"
      - "tsconfig.browser.json"
      - "package.json"
      - ".github/workflows/build-swf-toolkit.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TypeScript
        run: npm install --no-audit --no-fund
      - name: Compile browser-safe modules
        run: npm run build:swf-toolkit-browser
      - name: Commit generated static modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/vendor/swf-toolkit/dist
          if ! git diff --cached --quiet; then
            git commit -m "Build browser SWF toolkit modules"
            git push
          fi
